name: Profile statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stats.yml"
      - "scripts/generate_stats.py"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh statistics images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate statistics from the GitHub API
        env:
          # Public data by default. To include private contributions, add a
          # fine-grained or classic token as the repository secret PROFILE_STATS_TOKEN.
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/activity.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(stats): refresh profile statistics"
            git push
          fi
