<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Moneta, interface concept</title>
  <desc id="d">Concept preview of Moneta, a native macOS personal finance application in development, showing a dashboard with net worth, financial health, budgets and goals. Source code is private.</desc>
  <defs><radialGradient id="gT" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1FA89C" stop-opacity=".40"/><stop offset="1" stop-color="#1FA89C" stop-opacity="0"/></radialGradient>
<radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#C29B5B" stop-opacity=".30"/><stop offset="1" stop-color="#C29B5B" stop-opacity="0"/></radialGradient>
<linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D171B"/><stop offset="1" stop-color="#070C0E"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F5660"/><stop offset="1" stop-color="#0A3A42"/></linearGradient>
<linearGradient id="nw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#136773"/><stop offset="1" stop-color="#0A3A42"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9B574" stop-opacity=".38"/><stop offset="1" stop-color="#D9B574" stop-opacity="0"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9B574"/><stop offset="1" stop-color="#A9783A"/></linearGradient>
<filter id="drop" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="win"><rect x="70" y="30" width="760" height="424" rx="14"/></clipPath>
<clipPath id="frame"><rect width="900" height="520" rx="20"/></clipPath></defs>
  <style>.nav{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13px;font-weight:500;fill:#BBD2D3} .nav.on{fill:#F5F0E6;font-weight:600}.h1{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.3px;fill:#23282C} .sub{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:12.5px;fill:#7B7F82}.cl{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:500;fill:#B9D3D3} .ct{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13.5px;font-weight:650;fill:#23282C} .bl{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:11.5px;fill:#5F6569}.dots{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;letter-spacing:5px;fill:#F5F0E6} .brand{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;fill:#F5F0E6}.cap{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#93A4AA} .pill{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:11.5px;font-weight:600}.fill{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.draw{stroke-dasharray:1;animation:draw 1.8s ease-out .3s both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.areaIn{animation:fadein 1.2s ease-out 1.1s both}@keyframes fadein{from{opacity:0}to{opacity:1}}.arc{animation:arc 1.6s cubic-bezier(.2,.7,.2,1) .5s both}@keyframes arc{from{stroke-dasharray:0 100}to{stroke-dasharray:72 100}}.glowA{animation:fl 18s ease-in-out infinite}@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-14px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>
