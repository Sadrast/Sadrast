<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">Sadra Hosseini, Software Developer</title>
  <desc id="d">Animated banner for Sadra Hosseini: software developer focused on the Apple ecosystem and backend engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D161A"/>
      <stop offset="1" stop-color="#070C0E"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1FA89C" stop-opacity=".50"/>
      <stop offset="1" stop-color="#1FA89C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBronze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C29B5B" stop-opacity=".30"/>
      <stop offset="1" stop-color="#C29B5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FAFB"/>
      <stop offset="1" stop-color="#A5DCD5"/>
    </linearGradient>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FE3D6"/>
      <stop offset="1" stop-color="#D9B574"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BB3A8"/>
      <stop offset="1" stop-color="#C29B5B"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15292E"/>
      <stop offset="1" stop-color="#0A1316"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#6FE0D3" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="340">
      <rect width="900" height="340" fill="url(#fade)"/>
    </mask>
    <clipPath id="frame"><rect width="900" height="340" rx="22"/></clipPath>
    <path id="ringPath" d="M722 70A100 100 0 1 1 721.99 70"/>
    <mask id="nameMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="340">
      <text class="nm" x="54" y="142" fill="#fff">SADRA</text>
      <text class="nm" x="54" y="212" fill="#fff">HOSSEINI</text>
    </mask>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
    .nm{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:70px;font-weight:800;letter-spacing:1.5px}
    .pill{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:12.5px;font-weight:500;fill:#9FB4B9}
    .spin1{transform-origin:722px 170px;animation:spin 110s linear infinite}
    .spin2{transform-origin:722px 170px;animation:spin 80s linear infinite reverse}
    .drift{animation:drift 9s linear infinite}
    .floatA{animation:floatA 16s ease-in-out infinite}
    .floatB{animation:floatB 20s ease-in-out infinite}
    .sheenbar{animation:sheen 10s ease-in-out infinite}
    .pulse{transform-origin:722px 170px;animation:pulse 6s ease-out infinite}
    .rise1{animation:rise .9s cubic-bezier(.2,.7,.2,1) .15s both}
    .rise2{animation:rise .9s cubic-bezier(.2,.7,.2,1) .30s both}
    .rise3{animation:rise .9s cubic-bezier(.2,.7,.2,1) .50s both}
    .rise4{animation:rise .9s cubic-bezier(.2,.7,.2,1) .65s both}
    .emblem{transform-origin:722px 170px;animation:emblem 1.1s cubic-bezier(.2,.7,.2,1) .2s both}
    .ruleline{transform-origin:56px 0;animation:ruleGrow 1s cubic-bezier(.2,.7,.2,1) .4s both}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes drift{to{transform:translate(30px,30px)}}
    @keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(-34px,22px)}}
    @keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-18px)}}
    @keyframes sheen{0%{transform:translateX(-220px)}38%,100%{transform:translateX(620px)}}
    @keyframes pulse{0%{transform:scale(.62);opacity:.55}100%{transform:scale(1.18);opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes emblem{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
    @keyframes ruleGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="url(#bg)"/>
    <g class="floatA"><circle cx="760" cy="150" r="250" fill="url(#glowTeal)"/></g>
    <g class="floatB"><circle cx="40" cy="330" r="210" fill="url(#glowBronze)"/></g>

    <g mask="url(#gridMask)">
      <rect class="drift" x="-30" y="-30" width="960" height="400" fill="url(#grid)"/>
    </g>

    <g class="emblem">
      <circle class="pulse" cx="722" cy="170" r="100" fill="none" stroke="#3FC1B5" stroke-width="1.2"/>
      <g class="spin1">
        <circle cx="722" cy="170" r="128" fill="none" stroke="#3FC1B5" stroke-opacity=".38" stroke-dasharray="1 9"/>
        <circle cx="850" cy="170" r="4.5" fill="#C29B5B"/>
        <circle cx="850" cy="170" r="10" fill="#C29B5B" fill-opacity=".18"/>
      </g>
      <g class="spin2">
        <text class="sans" font-size="11" font-weight="500" fill="#8FA7AC" letter-spacing="1.2">
          <textPath href="#ringPath" textLength="618" lengthAdjust="spacing">Software Developer  ◆  Apple Ecosystem  ◆  Backend Engineering  ◆  Product Builder  ◆</textPath>
        </text>
        <circle cx="722" cy="70" r="3.5" fill="#3FC1B5"/>
      </g>
      <circle cx="722" cy="170" r="74" fill="url(#disc)" stroke="#2A4B52" stroke-width="1.2"/>
      <circle cx="722" cy="170" r="66" fill="none" stroke="#C29B5B" stroke-opacity=".35" stroke-width="1"/>
      <text class="sans" x="722" y="187" text-anchor="middle" font-size="50" font-weight="800" letter-spacing="1" fill="url(#monoGrad)">SH</text>
    </g>

    <g class="rise1"><text class="nm" x="54" y="142" fill="url(#nameGrad)">SADRA</text></g>
    <g class="rise2"><text class="nm" x="54" y="212" fill="url(#nameGrad)">HOSSEINI</text></g>
    <g mask="url(#nameMask)"><rect class="sheenbar" x="0" y="60" width="140" height="170" fill="url(#sheen)" opacity=".55"/></g>

    <rect class="ruleline" x="56" y="232" width="150" height="2.5" rx="1.25" fill="url(#rule)"/>

    <g class="rise3">
      <text class="sans" x="56" y="266" font-size="22" font-weight="600" fill="#E9F1F2">Software Developer</text>
      <text class="sans" x="56" y="290" font-size="15.5" font-weight="400" fill="#7F959B">Apple Ecosystem &amp; Backend Engineering</text>
    </g>

    <g class="rise4">
      <rect x="56" y="302" width="56" height="24" rx="12" fill="#0F1D21" stroke="#27424A"/>
      <text class="pill" x="84" y="318" text-anchor="middle">Swift</text>
      <rect x="120" y="302" width="86" height="24" rx="12" fill="#0F1D21" stroke="#27424A"/>
      <text class="pill" x="163" y="318" text-anchor="middle">TypeScript</text>
      <rect x="214" y="302" width="72" height="24" rx="12" fill="#0F1D21" stroke="#27424A"/>
      <text class="pill" x="250" y="318" text-anchor="middle">Node.js</text>
      <rect x="294" y="302" width="92" height="24" rx="12" fill="#0F1D21" stroke="#27424A"/>
      <text class="pill" x="340" y="318" text-anchor="middle">PostgreSQL</text>
    </g>

    <path d="M22 44V28a6 6 0 0 1 6-6h16" fill="none" stroke="#3FC1B5" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M878 296v16a6 6 0 0 1-6 6h-16" fill="none" stroke="#C29B5B" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <rect x=".5" y=".5" width="899" height="339" rx="21.5" fill="none" stroke="#1F3036"/>
</svg>
