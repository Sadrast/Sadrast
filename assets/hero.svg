<svg width="1200" height="360" viewBox="0 0 1200 360"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101C20"/>
    <stop offset="55%" stop-color="#142B30"/>
    <stop offset="100%" stop-color="#101619"/>
  </linearGradient>

  <linearGradient id="accent">
    <stop offset="0%" stop-color="#65C8C0"/>
    <stop offset="100%" stop-color="#B69A62"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40"
  patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
    fill="none" stroke="#6CA5A0"
    stroke-opacity=".12" stroke-width="1"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#grid)"/>

<circle cx="1010" cy="100" r="125"
fill="#368F89" opacity=".12" filter="url(#glow)"/>

<circle cx="1040" cy="110" r="75"
fill="none" stroke="#65C8C0"
stroke-opacity=".25"/>

<circle cx="1040" cy="110" r="105"
fill="none" stroke="#B69A62"
stroke-opacity=".20"/>

<path d="M0 290 Q300 240 600 300 T1200 260"
fill="none" stroke="#65C8C0"
stroke-opacity=".15" stroke-width="2"/>

<text x="75" y="110"
fill="#65C8C0"
font-family="Arial,sans-serif"
font-size="17"
letter-spacing="7">SOFTWARE DEVELOPER</text>

<text x="70" y="190"
fill="#F5F5F0"
font-family="Arial,sans-serif"
font-size="65"
font-weight="bold"
letter-spacing="2">SADRA HOSSEINI</text>

<rect x="75" y="215" width="75" height="3"
rx="2" fill="url(#accent)"/>

<text x="75" y="260"
fill="#B5C9C5"
font-family="Arial,sans-serif"
font-size="20"
letter-spacing="2">APPLE ECOSYSTEM  /  BACKEND ENGINEERING</text>

<text x="75" y="310"
fill="#819895"
font-family="Arial,sans-serif"
font-size="13"
letter-spacing="3">BUILDING PRODUCTS. ENGINEERING EXPERIENCES.</text>

<text x="1040" y="330"
text-anchor="middle"
fill="#65C8C0"
font-family="monospace"
font-size="13">S / 01</text>

</svg>
