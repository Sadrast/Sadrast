<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">GitHub statistics</title>
  <desc id="d">GitHub statistics for Sadrast: 2 public repositories, 0 stars, 4 followers, and a language breakdown.</desc>
  <defs><clipPath id="pill"><rect x="500" y="66" width="370" height="12" rx="6"/></clipPath></defs>
  <style>
    .v{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.6px;fill:#E9F1F2}
    .l{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#93A4AA}
    .h{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:650;fill:#E9F1F2}
    .n{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:14px;fill:#E9F1F2}
    .p{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:13px;fill:#93A4AA}
    .f{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:11.5px;fill:#5E7077}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none !important}}
  </style>
  <rect x=".5" y=".5" width="899" height="299" rx="16" fill="#0C1417" stroke="#1F3036"/>
