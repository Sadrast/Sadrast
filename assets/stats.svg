  <text class="v" x="30" y="154">4</text><text class="l" x="30" y="177">Followers</text>
  <text class="v" x="250" y="154">4</text><text class="l" x="250" y="177">Commits (12 mo)</text>
  <text class="v" x="30" y="220">0</text><text class="l" x="30" y="243">Pull requests (12 mo)</text>
  <text class="v" x="250" y="220">0</text><text class="l" x="250" y="243">Issues (12 mo)</text>
  <path d="M470.5 28v236" stroke="#1F3036"/>
  <text class="h" x="500" y="44">Languages in public repositories</text>
  <g clip-path="url(#pill)"><rect x="500" y="66" width="370" height="12" fill="#16262B"/><g class="bar"><rect x="500.00" y="66" width="370.00" height="12" fill="#3572A5"/></g></g>
  <circle cx="505" cy="108" r="5" fill="#3572A5"/><text class="n" x="520" y="112">Python</text><text class="p" x="870" y="112" text-anchor="end">100.0%</text>
